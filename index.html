<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查看报告</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#252525;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #cf2768;outline-offset:3px}.app{max-width:500px;margin:auto;min-height:100vh;background:#f6f7f9}header{height:66px;background:#fff;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:3}h1{font-size:21px;font-weight:600;margin:0}.back{position:absolute;left:17px;border:0;background:none;font-size:32px;line-height:1;padding:0 10px}.capsule{position:absolute;right:16px;border:1px solid #ebebeb;border-radius:22px;display:flex;align-items:center;padding:7px 13px;font-size:18px;gap:13px}.capsule i{height:20px;width:1px;background:#eee}.capsule b{line-height:18px}.person{margin:16px 16px 12px;background:#fff;box-shadow:0 2px 4px #00000006;border:1px solid #f0f0f0;border-radius:12px;padding:20px 16px;display:flex;align-items:center;gap:10px}.person svg{width:19px;color:#ca1336;flex-shrink:0}.person strong{font-size:16px;font-weight:500}.number{font-size:13px;color:#666}.switch{border:0;background:none;color:#d65075;margin-left:auto;padding:0;font-size:13px;white-space:nowrap}.tabs{display:flex;padding:0 14px;justify-content:space-between;border-bottom:1px solid #eceef0}.tab{border:0;background:none;padding:17px 4px 15px;color:#333;font-size:15px;position:relative;white-space:nowrap}.tab.active{color:#d14378;font-weight:600}.tab.active:after{content:'';position:absolute;bottom:0;height:3px;background:#db4386;left:10px;right:10px}.filters{padding:22px 20px 18px}.dates{display:flex;gap:12px}.date{display:flex;align-items:center;border:1px solid #d9d9d5;background:#fafafa;border-radius:4px;padding:10px 8px;flex:1;min-width:0;font-size:12px;gap:3px}.date label{white-space:nowrap;color:#555}.date input{width:100%;min-width:0;border:0;color:#333;background:transparent;font der-collapse:collapse;font-size:12px}.result-table th{background:#fcf5f8;font-weight:400;color:#a2637c;padding:13px 12px;text-align:left}.result-table td{padding:19px 12px;border-bottom:1px solid #f0f0f2;line-height:1.8}.result-table td:first-child{width:46%;font-size:13px}.sheet-note{padding:16px;color:#96969e;font-size:11px;line-height:1.9}.detail-note{margin:16px 2px;font-size:12px;line-height:1.9;color:#92929b}.print{border:0;color:white;background:linear-gradient(110deg,#e9609f,#cd1c62);width:100%;padding:14px;border-radius:7px;margin-top:8px}.demo{display:inline-block;color:#bc8b9d;background:#fff5f8;padding:3px 8px;border-radius:4px;font-size:10px;margin-top:10px}dialog{border:0;border-radius:12px;width:calc(100% - 48px);max-width:370px;padding:24px;color:#444}dialog::backdrop{background:#0005}dialog h3{font-size:17px;margin-top:0}dialog p{color:#999;font-size:12px;line-height:1.8}dialog button{padding:12px;width:100%;border:0;border-radius:6px;background:#d63a7b;color:white}dialog .patient-choice{background:#fff5f8;color:#b23869;border:1px solid #efd2de;margin-bottom:15px;text-align:left}footer{font-size:12px;color:#96516d;text-align:center;padding:16px 12px 24px;border-top:1px solid #eadce2}[hidden]{display:none!important}@media(min-width:600px){body{padding:26px 0}.app{border:1px solid #e7e7ec;border-radius:16px;overflow:clip;box-shadow:0 10px 50px #27324c08}header{border-bottom:1px solid #f2f2f4}}@media(max-width:370px){.number{font-size:11px}.person{gap:6px;padding:18px 12px}.switch{font-size:12px}.tab{font-size:13px}.dates{gap:6px}.date{font-size:11px;padding:10px 4px}.date input{font-size:10px}.ranges{gap:12px}}@media print{body{background:#fff;padding:0}.app{max-width:none;border:0;box-shadow:none}header,.print{display:none}footer{display:block!important;color:#96516d}.detail{padding:0}.detail-note{color:#777}.demo{color:#777}}
.sheet{position:relative}.demo{color:#ad245b;background:#ffe9f2;border:1px solid #efbdd0}.normal-result{color:#288566;font-weight:600}.status{color:#288566;background:#eef8f2}</style></head><body><div class="app"><header><button class="back" aria-label="返回" id="back">‹</button><h1 id="page-title">查看报告</h1><div class="capsule" aria-hidden="true"><b>•••</b><i></i><b>⦿</b></div></header><div id="query"><div class="person"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="4"/><path d="M4 22v-5a8 8 0 0116 0v5z"/></svg><strong>*然松</strong><span class="number">0005031542</span><button class="switch" id="switch">切换就诊人 ⟳</button></div><nav class="tabs" aria-label="报告分类"><button class="tab active" aria-selected="true">检验报告</button><button class="tab" aria-selected="false">检查报告</button><button class="tab" aria-selected="false">遗传室报告</button><button class="tab" aria-selected="false">病理报告</button></nav><section class="filters"><div class="dates"><div class="date"><label for="start">开始时间：</label><input type="date" id="start" value="2026-08-12"></div><div class="date"><label for="end">结束时间：</label><input type="date" id="end" value="2026-11-10"></div></div><div class="ranges"><button data-days="30">最近30天</button><button data-days="90" class="selected">最近90天</button><button data-days="180">最近180天</button></div></section><div class="meta"><span id="count">共 7 份报告</span></div><div class="list" id="list"></div><div class="empty" id="empty" hidden><svg viewBox="0 0 120 125" fill="none"><rect x="13" y="13" width="75" height="95" rx="9" stroke="#e4e4e4" stroke-width="3" transform="rotate(-12 13 13)"/><rect x="33" y="23" width="75" height="95" rx="9" fill="white" stroke="#e3e3e3" stroke-width="3"/><path d="M45 40h13v13H45z" fill="#cf1735"/><path d="M65 44h29M65 50h22M45 66h13M65 66h29M45 84h13M65 84h29" stroke="#dedede" stroke-width="5"/><circle cx="101" cy="104" r="19" fill="#d31a38"/><path d="M101 93v22M90 104h22" stroke="white" stroke-width="4" stroke-linecap="round"/></svg><p id="empty-title">未查询到检验报告</p><small>请调整查询时间或切换报告分类</small></div><p class="tip">点击报告查看详情</p></div><div id="detail" class="detail" hidden></div><footer>演示数据 · 非正式报告</footer></div><dialog id="patients"><h3>选择就诊人</h3><button class="patient-choice" onclick="this.closest('dialog').close()">*然松　0005031542　✓</button><p>当前仅展示所选就诊人。</p><button onclick="this.closest('dialog').close()">关闭</button></dialog><dialog id="navigation"><h3>报告查看</h3><p>此页面为报告查询与查看模块，从医院小程序的“就诊服务 → 报告查询”进入。</p><button onclick="this.closest('dialog').close()">我知道了</button></dialog><script>
const reports=[['淋球菌（淋病）','淋球菌检测'],['沙眼衣原体','沙眼衣原体检测'],['解脲支原体','解脲支原体检测'],['梅毒（TP）','梅毒（TP）检测'],['HIV（艾滋）','HIV检测'],['单纯疱疹2型（生殖器疱疹）','单纯疱疹2型检测'],['乙肝表面抗原（HBsAg）','乙肝表面抗原检测']];const sampleResults=[['淋球菌核酸','阴性（−）','阴性','首段尿','核酸检测'],['沙眼衣原体核酸','阴性（−）','阴性','首段尿','核酸检测'],['解脲支原体核酸','阴性（−）','阴性','首段尿','核酸检测'],['梅毒螺旋体抗体（TP-Ab）','阴性（−）','阴性','血清','免疫学检测'],['HIV抗原/抗体联合检测','阴性（−）','阴性','血清','免疫学检测'],['单纯疱疹病毒2型核酸（HSV-2 DNA）','未检出','未检出','局部拭子','核酸检测'],['乙肝表面抗原（HBsAg）','阴性（−）','阴性','血清','免疫学检测']];const reportIds=(()=>{let saved;try{saved=JSON.parse(localStorage.getItem('demo-report-ids-v1'))}catch{}if(Array.isArray(saved)&&saved.length===7&&new Set(saved).size===7&&saved.every(v=>/^20261110[0-9]{6}$/.test(v)))return saved;const used=new Set();while(used.size<7){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);used.add('20261110'+String(bytes[0]%1000000).padStart(6,'0'))}const ids=[...used];try{localStorage.setItem('demo-report-ids-v1',JSON.stringify(ids))}catch{}return ids})();let selectedTab=0;const $=id=>document.getElementById(id);function render(){const valid=$('start').value&&$('end').value&&$('start').value<=$('end').value;const matches=valid&&$('start').value<='2026-11-10'&&$('end').value>='2026-11-10'&&selectedTab===0;$('count').textContent=valid?'共 '+(matches?7:0)+' 份报告':'请选择有效的时间范围';$('list').hidden=!matches;$('empty').hidden=matches;$('empty-title').textContent=valid?'未查询到'+['检验报告','检查报告','遗传室报告','病理报告'][selectedTab]:'开始时间不能晚于结束时间';$('list').innerHTML=matches?reports.map(([name,title],i)=>`<button class="report" onclick="showReport(${i})" aria-label="查看${title}"><div class="report-top"><span class="paper">≡</span><h2>${title}</h2><span class="status">已完成</span><span class="arrow">›</span></div><div class="report-bottom"><span>申请日期：2026-11-10</span><span>男性科室</span></div></button>`).join(''):''}function showReport(i){const [name,title]=reports[i];const [test,result,reference,specimen,method]=sampleResults[i];$('query').hidden=true;$('detail').hidden=false;$('page-title').textContent='报告详情';$('detail').innerHTML=`<section class="sheet"><div class="detail-heading"><h2>检验报告单</h2><p>${title}</p></div><div class="patient-info"><div><label>姓名</label>*然松</div><div><label>就诊号</label>0005031542</div><div><label>科室</label>男性科室</div><div><label>报告状态</label>已完成</div><div class="wide"><label>报告编号</label>${reportIds[i]}</div><div class="wide"><label>申请时间</label>2026-11-10</div><div class="wide"><label>标本类型</label>${specimen}</div><div class="wide"><label>检测方法</label>${method}</div></div><table class="result-table"><thead><tr><th>检验项目</th><th>结果</th><th>参考范围</th></tr></thead><tbody><tr><td>${test}</td><td class="normal-result">${result}</td><td>${reference}</td></tr></tbody></table><div class="sheet-note">检验者：—　　审核者：—<br>采样时间：2026-11-10 09:58<br>报告时间：2026-11-10 17:24${i===6?'<br>本例仅展示乙肝表面抗原，不代表乙肝五项或完整乙肝评估。':''}</div></section><button class="print" onclick="window.print()">保存 / 打印报告页面</button>`;window.scrollTo(0,0)}$('back').onclick=()=>{if(!$('detail').hidden){$('detail').hidden=true;$('query').hidden=false;$('page-title').textContent='查看报告'}else $('navigation').showModal()};$('switch').onclick=()=>$('patients').showModal();document.querySelectorAll('.tab').forEach((el,i)=>el.onclick=()=>{selectedTab=i;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b===el);b.setAttribute('aria-selected',b===el)});render()});document.querySelectorAll('[data-days]').forEach(el=>el.onclick=()=>{const end=new Date(2026,10,10);const start=new Date(end);start.setDate(start.getDate()-Number(el.dataset.days));const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;$('start').value=fmt(start);$('end').value=fmt(end);document.querySelectorAll('[data-days]').forEach(b=>b.classList.toggle('selected',el===b));render()});['start','end'].forEach(id=>$(id).onchange=()=>{document.querySelectorAll('[data-days]').forEach(b=>b.classList.remove('selected'));render()});render();
</script></body></html>
